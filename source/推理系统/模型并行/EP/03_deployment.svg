<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" width="1040" height="490">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="520.0" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">Deployment Choices for 8 Experts / 4 GPUs</text>
<rect x="170" y="65" width="700" height="67" rx="12" fill="#e7eef8" stroke="#94a3b8"/>
<text x="520.0" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">Single GPU (No EP)</text>
<text x="520.0" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">GPU0 holds E0...E7; routing stays local</text>
<path d="M 520.0 133 V 156" stroke="#0f766e" stroke-width="3"/>
<path d="M 513.0 148 L 520.0 157 L 527.0 148" fill="none" stroke="#0f766e" stroke-width="3"/>
<rect x="170" y="160" width="700" height="67" rx="12" fill="#dff7f0" stroke="#94a3b8"/>
<text x="520.0" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">DP=4</text>
<text x="520.0" y="209" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Each GPU holds E0...E7; requests are divided</text>
<path d="M 520.0 228 V 251" stroke="#0f766e" stroke-width="3"/>
<path d="M 513.0 243 L 520.0 252 L 527.0 243" fill="none" stroke="#0f766e" stroke-width="3"/>
<rect x="170" y="255" width="700" height="67" rx="12" fill="#e7eef8" stroke="#94a3b8"/>
<text x="520.0" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">TP=4</text>
<text x="520.0" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Each GPU holds one shard of every Expert matrix</text>
<path d="M 520.0 323 V 346" stroke="#0f766e" stroke-width="3"/>
<path d="M 513.0 338 L 520.0 347 L 527.0 338" fill="none" stroke="#0f766e" stroke-width="3"/>
<rect x="170" y="350" width="700" height="67" rx="12" fill="#dff7f0" stroke="#94a3b8"/>
<text x="520.0" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">EP=4</text>
<text x="520.0" y="399" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">GPU0:E0,E1 | GPU1:E2,E3 | GPU2:E4,E5 | GPU3:E6,E7</text>
</svg>