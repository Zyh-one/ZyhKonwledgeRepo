<text x="520.0" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">TP communication</text>
<text x="520.0" y="209" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Partial output contributions → reduction</text>
<path d="M 520.0 228 V 251" stroke="#0f766e" stroke-width="3"/>
<path d="M 513.0 243 L 520.0 252 L 527.0 243" fill="none" stroke="#0f766e" stroke-width="3"/>
<rect x="170" y="255" width="700" height="67" rx="12" fill="#e7eef8" stroke="#94a3b8"/>
<text x="520.0" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">Expert Parallelism (EP)</text>
<text x="520.0" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Place different whole experts on different GPUs</text>
<path d="M 520.0 323 V 346" stroke="#0f766e" stroke-width="3"/>
<path d="M 513.0 338 L 520.0 347 L 527.0 338" fill="none" stroke="#0f766e" stroke-width="3"/>
