<text x="520.0" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">EP communication</text>
<text x="520.0" y="399" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Token dispatch / output return (often All-to-All)</text>
</svg>