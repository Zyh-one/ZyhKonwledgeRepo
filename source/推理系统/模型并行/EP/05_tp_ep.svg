<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" width="1040" height="490">
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="520.0" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">TP versus EP</text>
<rect x="170" y="65" width="700" height="67" rx="12" fill="#e7eef8" stroke="#94a3b8"/>
<text x="520.0" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#0f172a">Tensor Parallelism (TP)</text>
<text x="520.0" y="114" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Split one expert weight matrix into shards</text>
<path d="M 520.0 133 V 156" stroke="#0f766e" stroke-width="3"/>
<path d="M 513.0 148 L 520.0 157 L 527.0 148" fill="none" stroke="#0f766e" stroke-width="3"/>
